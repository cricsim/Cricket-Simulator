[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cricsim"
version = "0.1.0"
description = "Ball-by-ball T20 cricket simulator built on the Cricbuzz Cricket API (RapidAPI). Unofficial example."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cricsim = "cricsim.cli:app"

[tool.setuptools.packages.find]
include = ["cricsim*"]

[tool.setuptools.package-data]
cricsim = ["priors/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008",  # typer.Option(...) defaults are the Typer idiom
    "B905",  # zipped outcome vectors have equal length by construction
]
